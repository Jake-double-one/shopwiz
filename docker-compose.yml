# ShopWiz – ready for Portainer stacks (Stacks → Add stack → Web editor or Repository).
# Web editor: uses the prebuilt image from GitHub Container Registry.
# Repository / CLI: `docker compose up -d --build` builds it from this repo instead.
services:
  shopwiz:
    image: ghcr.io/jake-double-one/shopwiz:latest
    build: .
    container_name: shopwiz
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Public address, used for link previews (Open Graph) – e.g. https://shop.example.com
      PUBLIC_URL: ""
      # Default for new IDs: delete after this many days without any active device (max 367)
      SPACE_TTL_DAYS: "181"
      # Devices without activity are removed after this many days
      DEVICE_TTL_DAYS: "30"
      # History entries and deleted items are kept this long
      ACTIVITY_TTL_DAYS: "14"
      # Set to "true" behind a reverse proxy so rate limiting sees the real client address
      TRUST_PROXY: "false"
      LOG_LEVEL: "warn"
      # Travel mode translations: mymemory (free, no key) | libretranslate | deepl | google | none
      TRANSLATE_PROVIDER: "mymemory"
      # Key for deepl / google
      TRANSLATE_API_KEY: ""
      # Optional for mymemory: raises the free quota (~5,000 → ~50,000 characters a day)
      TRANSLATE_EMAIL: ""
      # For libretranslate: address of your instance (see the service below)
      # TRANSLATE_URL: "http://libretranslate:5000"
    volumes:
      - shopwiz-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional: your own translation service, free and private (needs 1–2 GB RAM).
  # Uncomment it and set TRANSLATE_PROVIDER: "libretranslate" + TRANSLATE_URL above.
  # libretranslate:
  #   image: libretranslate/libretranslate:latest
  #   restart: unless-stopped
  #   environment:
  #     LT_LOAD_ONLY: "de,en,it,es,fr,hr,el,pt,nl"   # languages you need (fewer = less RAM)
  #   volumes:
  #     - libretranslate-models:/home/libretranslate/.local

volumes:
  shopwiz-data:
  # libretranslate-models:
