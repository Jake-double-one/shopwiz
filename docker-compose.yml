# ShopWiz – ready for Portainer stacks (Stacks → Add stack → Web editor or Repository).
# Web editor: uses the prebuilt image from GitHub Container Registry.
# Repository / CLI: `docker compose up -d --build` builds it from this repo instead.
services:
  shopwiz:
    image: ghcr.io/jake-double-one/shopwiz:latest
    build: .
    container_name: shopwiz
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Public address, used for link previews (Open Graph) – e.g. https://shop.example.com
      PUBLIC_URL: ""
      # Default for new IDs: delete after this many days without any active device (max 367)
      SPACE_TTL_DAYS: "181"
      # Devices without activity are removed after this many days
      DEVICE_TTL_DAYS: "30"
      # History entries and deleted items are kept this long
      ACTIVITY_TTL_DAYS: "14"
      # Set to "true" behind a reverse proxy so rate limiting sees the real client address
      TRUST_PROXY: "false"
      LOG_LEVEL: "warn"
      # AI assistants (Claude, ChatGPT, Grok, Siri …) via MCP (/mcp) and REST (/api/v1).
      # Connect them in ShopWiz: Settings → AI assistants. Needs HTTPS from the internet.
      MCP_ENABLED: "false"
      # Travel mode translations: one service or several in order – the next one steps in
      # when one is used up or down. mymemory (free, no key) | deepl | azure | google | libretranslate | none
      TRANSLATE_PROVIDER: "mymemory"
      # One key per service – only for the ones listed above
      DEEPL_API_KEY: ""
      AZURE_TRANSLATOR_KEY: ""
      AZURE_TRANSLATOR_REGION: ""        # e.g. westeurope
      GOOGLE_API_KEY: ""
      # Optional for mymemory: raises the free quota (~5,000 → ~50,000 characters a day)
      MYMEMORY_EMAIL: ""
      # For libretranslate: address of your instance (see the service below)
      # LIBRETRANSLATE_URL: "http://libretranslate:5000"
      # IDs a device may create itself (0 = no limit)
      SPACES_PER_DEVICE: "0"
      # Optional administration at /admin (HTTPS needed) – see docs/ADMIN.md. Off while empty.
      # The hash comes from: docker run --rm -it ghcr.io/jake-double-one/shopwiz node server/admin-hash.js
      # ADMIN_USER: ""
      # ADMIN_PASSWORD_HASH: ""
    volumes:
      - shopwiz-data:/data
      # your own skins: a folder with CSS files (see skins/README.md), picked up while running
      # - ./my-skins:/data/skins:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional: your own translation service, free and private (needs 1–2 GB RAM).
  # Uncomment it, add "libretranslate" to TRANSLATE_PROVIDER and set LIBRETRANSLATE_URL above.
  # libretranslate:
  #   image: libretranslate/libretranslate:latest
  #   restart: unless-stopped
  #   environment:
  #     LT_LOAD_ONLY: "de,en,it,es,fr,hr,el,pt,nl"   # languages you need (fewer = less RAM)
  #   volumes:
  #     - libretranslate-models:/home/libretranslate/.local

volumes:
  shopwiz-data:
  # libretranslate-models:
