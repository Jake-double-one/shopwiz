name: Dependency audit

# Every night, and by hand: known vulnerabilities in the npm packages and in the published image
# (Alpine packages, Node itself, the bundled packages). A red run means: look, and update.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  npm:
    name: npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # what ships in the image: anything moderate or worse fails the run
      - name: Packages in the image (production)
        run: npm audit --omit=dev --audit-level=moderate
      # build and test tools: high or worse fails, the rest is in the log
      - name: Build and test tools (development)
        run: npm audit --audit-level=high

  runtime:
    name: Node in the image
    runs-on: ubuntu-latest
    steps:
      # the SQLite inside Node is no Alpine package – Trivy can't see it. Node's own security
      # releases are what carry its updates: the image must run the newest Node of its LTS line
      - name: Node and SQLite in the image vs. the newest Node 22
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          have=$(docker run --rm ghcr.io/jake-double-one/shopwiz:latest node -p "process.version + ' (SQLite ' + process.versions.sqlite + ')'")
          want=$(curl -fsS https://nodejs.org/dist/index.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).find(v => v.version.startsWith('v22.')).version")
          echo "image: $have – newest Node 22: $want"
          [ "${have%% *}" = "$want" ] || { echo "::error::the image runs ${have%% *}, newest is $want – bump the digest in the Dockerfile (Dependabot does it weekly)"; exit 1; }

  image:
    name: published image
    runs-on: ubuntu-latest
    steps:
      - name: Scan ghcr.io/jake-double-one/shopwiz:latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/jake-double-one/shopwiz:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
