name: Dependency audit

# Every night, and by hand: known vulnerabilities in the npm packages and in the published image
# (Alpine packages, Node itself, the bundled packages). A red run means: look, and update.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  npm:
    name: npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # what ships in the image: anything moderate or worse fails the run
      - name: Packages in the image (production)
        run: npm audit --omit=dev --audit-level=moderate
      # build and test tools: high or worse fails, the rest is in the log
      - name: Build and test tools (development)
        run: npm audit --audit-level=high

  image:
    name: published image
    runs-on: ubuntu-latest
    steps:
      - name: Scan ghcr.io/jake-double-one/shopwiz:latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/jake-double-one/shopwiz:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
