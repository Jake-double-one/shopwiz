# Weekly updates for the packages, the GitHub Actions and the base image – each as a pull request
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node stays on its LTS line (22 until April 2027): digest and patch updates only – a new
    # major is a deliberate change, tested with the app, not a weekly bump
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
